name: Continuous Deployment

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: SSRS.Brand.Editor.slnx
  CONFIGURATION: Release

jobs:
  deploy:
    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        run: |
          $tagName = "$env:GITHUB_REF" -replace '^refs/tags/v', ''
          echo "VERSION=$tagName" >> $env:GITHUB_OUTPUT
          echo "Extracted version: $tagName"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          -p:VersionPrefix=${{ steps.version.outputs.VERSION }}
          -p:VersionSuffix=
          -p:FileVersion=${{ steps.version.outputs.VERSION }}
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --report-trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results/*.trx

      - name: Publish application
        run: >
          dotnet publish src/SSRS.Brand.Editor/SSRS.Brand.Editor.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime win-x64
          --output ./publish
          -p:VersionPrefix=${{ steps.version.outputs.VERSION }}
          -p:VersionSuffix=
          -p:FileVersion=${{ steps.version.outputs.VERSION }}

      - name: Archive published output
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          Compress-Archive -Path ./publish/* -DestinationPath ./artifacts/SSRS.Brand.Editor.win-x64.${{ steps.version.outputs.VERSION }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SSRS.Brand.Editor
          path: ./artifacts/SSRS.Brand.Editor.win-x64.${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ./artifacts/SSRS.Brand.Editor.win-x64.${{ steps.version.outputs.VERSION }}.zip
